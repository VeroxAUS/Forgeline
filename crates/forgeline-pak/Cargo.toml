[package]
name = "forgeline-pak"
description = "Forgeline pack reader: indexes the game's original .pak files and reads single entries (read-only), plus the exe string scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
miniz_oxide = "0.8"
num-bigint = "0.4"
zstd = "0.13"

[features]
# Synthetic pack builder for tests in this and other crates (never in the app).
test-support = []

[dev-dependencies]
forgeline-pak = { path = ".", features = ["test-support"] }
