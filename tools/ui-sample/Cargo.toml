[package]
name = "ui-sample"
description = "Element 1 of the UX design plan: the sample Build screen in three style variants (not shipped)"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "MPL-2.0"
publish = false

[features]
# `cargo run --features window` opens the sample in a real window (needs a GPU; the maintainer's PC).
window = ["dep:eframe"]

[dependencies]
egui = { version = "0.37", default-features = false }
png = "0.17"
eframe = { version = "0.37", optional = true }

# Only to put the icon thread in background mode (low CPU, disk and memory priority).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[[bin]]
name = "window"
required-features = ["window"]

[[bin]]
name = "shell_window"
required-features = ["window"]

[[bin]]
name = "icons_window"
required-features = ["window"]

[[bin]]
name = "build_window"
required-features = ["window"]
