<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Monster Hunter Wilds Gear Progression Helper</title>
  <desc id="d">Planned desktop app that shows the best build you can make right now. Five empty gear tiles (weapon, armor, decorations, talisman, upgrades) mark what it will fill. Status: pre-alpha, nothing usable yet.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2330" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#e0a43a"/><stop offset="1" stop-color="#4fb3a9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="26" fill="#0d1117"/>
  <rect width="1200" height="380" rx="26" fill="url(#grid)"/>
  <rect x="0" y="0" width="10" height="380" fill="url(#bar)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 62)">
      <rect width="318" height="38" rx="19" fill="#2a2110" stroke="#e0a43a"/>
      <text x="159" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#e0a43a" letter-spacing="1">PRE-ALPHA · PHASE 1</text>
      <text y="150" font-size="50" font-weight="800" fill="#e6edf3">Monster Hunter Wilds</text>
      <text y="212" font-size="50" font-weight="800" fill="#e0a43a">Gear Progression Helper</text>
      <text y="262" font-size="26" fill="#c9d1d9">The best build you can make right now.</text>
      <text y="296" font-size="22" fill="#8b949e">From your first hunt to endgame, low rank to high rank.</text>
    </g>
    <g transform="translate(704 56)">
      <g fill="#161b22" stroke="#4fb3a9" stroke-width="2" stroke-dasharray="8 6">
        <rect width="140" height="120" rx="14"/>
        <rect x="160" width="140" height="120" rx="14"/>
        <rect x="320" width="140" height="120" rx="14"/>
        <rect x="80" y="144" width="140" height="120" rx="14"/>
        <rect x="240" y="144" width="140" height="120" rx="14"/>
      </g>
      <g font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">
        <text x="70" y="72">Weapon</text>
        <text x="230" y="72">Armor</text>
        <text x="390" y="72">Decorations</text>
        <text x="150" y="216">Talisman</text>
        <text x="310" y="216">Upgrades</text>
      </g>
      <text x="230" y="308" font-size="20" fill="#8b949e" text-anchor="middle">Planned: nothing usable yet</text>
    </g>
  </g>
</svg>
