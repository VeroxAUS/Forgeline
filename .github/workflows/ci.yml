name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every commit in the pull request must use an allowed identity (repo_hygiene.rs).
      HYGIENE_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ram:
    name: RAM check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        shell: bash
      - run: cargo build --release --locked -p forgeline-app
      - name: Headless check (fails above 20 MB private bytes)
        run: target/release/forgeline --headless-check fixtures --results-dir bench/results
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ram-results-${{ matrix.os }}
          path: bench/results/*.json
          if-no-files-found: ignore
