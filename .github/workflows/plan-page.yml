name: plan-page
on:
  pull_request:
    paths: ["tools/plan-page/**", ".github/workflows/plan-page.yml"]
  push:
    branches: [main]
    paths: ["tools/plan-page/**", ".github/workflows/plan-page.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/plan-page
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
